[package]
name = "revenant-sign-gui"
description = "Cross-platform desktop GUI for ARX CoSign / DocuSign Signature Appliance electronic signatures"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# A desktop application distributed via the app stores (Mac App Store, Microsoft
# Store, Snap, AppImage), not a library -- kept out of the crates.io publish set.
publish = false
# No rust-version: nothing depends on this crate, and it is built with the
# toolchain pinned in rust-toolchain.toml (egui alone needs 1.92).

[[bin]]
name = "revenant-gui"
path = "src/main.rs"

# Renders the app-store screenshots from the real UI (see `store_screenshots`).
# A release-pipeline tool, not part of the shipped app: it only builds with the
# `store-screenshots` feature, which the packaging builds never enable.
[[bin]]
name = "store-screenshots"
path = "src/bin/store_screenshots.rs"
required-features = ["store-screenshots"]

[features]
store-screenshots = ["dep:egui_kittest", "dep:image", "dep:tempfile"]

# GUI-only dependencies are pinned locally rather than in the workspace catalog:
# unlike the crypto/formats stack (which must stay version-aligned across crates)
# nothing else in the workspace depends on egui, so central pinning would only
# add noise. egui is used through `eframe::egui` to keep the two in lockstep.
[dependencies]
revenant-sign-core = { path = "../revenant-sign-core", version = "4.1.2" }
log.workspace = true
env_logger.workspace = true
eframe = "0.34"
sys-locale = "0.3.2"
# Native file open/save dialogs on all three platforms (AppKit / Win32 / xdg).
rfd = "0.17"
# Must track eframe's egui minor: 0.12 targets egui 0.34. (egui 0.35 has no
# egui-phosphor release yet, which is why we cap eframe at 0.34.)
egui-phosphor = "0.12"
# Headless rendering for the store screenshots; tracks eframe's egui minor.
egui_kittest = { version = "0.34.3", features = ["wgpu", "eframe"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tempfile = { workspace = true, optional = true }

# The system accent color (see `macos`). Already in the tree through eframe's
# clipboard crate; listed here with only the classes the app reads.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }

[lints]
workspace = true

[dev-dependencies]
ab_glyph = "0.2.32"
tempfile.workspace = true
