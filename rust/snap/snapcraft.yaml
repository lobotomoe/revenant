# Snap package manifest for Revenant (Rust build).
#
# Canonical location: rust/snap/snapcraft.yaml -- run `snapcraft` from the rust/
# directory (paths below are relative to rust/). The Python snapcraft is
# preserved, mothballed, under python/snap/.
#
# Build locally (Linux):   cd rust && snapcraft
# Publish:                 snapcraft upload revenant_*.snap --release=stable
# Prereq:                  sudo snap install snapcraft --classic
#
# Not buildable on macOS (snapcraft is Linux-only). Built in CI by
# .github/workflows/snap.yml and published by release.yml.
#
# vs the Python manifest: the `revenant` part switches from the python plugin
# (which bundled CPython + tkinter) to the rust plugin building the self-contained
# binaries; the apps, plugs, and gnome extension are unchanged.

name: revenant
title: Revenant
summary: Electronic document signing with ARX CoSign
description: |
  Cross-platform client for signing PDF documents via the ARX CoSign
  SOAP API (OASIS DSS standard). Works on macOS, Linux, and Windows
  without requiring a Windows-only CoSign client.

  Features:
  - Embedded PDF signatures with visual appearance
  - Detached CMS/PKCS#7 signatures
  - Pre-computed SHA-1 hash signing
  - Automatic signer identity discovery from server or signed PDFs
  - Secure credential storage via system keychain

grade: stable
confinement: strict
base: core24
license: Apache-2.0
icon: packaging/linux/io.github.lobotomoe.revenant.png
adopt-info: desktop-integration
website: https://github.com/lobotomoe/revenant
source-code: https://github.com/lobotomoe/revenant
contact: https://github.com/lobotomoe/revenant/issues
issues: https://github.com/lobotomoe/revenant/issues

platforms:
  amd64:
  arm64:

apps:
  revenant:
    command: bin/revenant
    plugs:
      - network
      - home
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

  revenant-gui:
    command: bin/revenant-gui
    common-id: io.github.lobotomoe.revenant
    plugs:
      - network
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - password-manager-service
    extensions:
      - gnome
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

parts:
  revenant:
    plugin: rust
    source: .
    # Build only the two shipped binary crates from the workspace.
    rust-path:
      - crates/revenant-sign
      - crates/revenant-sign-gui
    # The gnome extension points LD_LIBRARY_PATH at the GNOME SDK's glibc for
    # every part. rustup cannot run against it (symbol lookup error, exit 127),
    # which the rust plugin reports as "'rustup' not found". The Rust build links
    # nothing from the SDK, so clear it here. Drop this once the regression
    # behind https://github.com/canonical/snapcraft/issues/6330 is fixed.
    build-environment:
      - LD_LIBRARY_PATH: ""
    build-packages:
      - libdbus-1-dev
      - pkg-config
    # Secret Service (keyring) at runtime; GUI/GL libs come from the gnome
    # extension.
    stage-packages:
      - libdbus-1-3

  # Carries the version (adopt-info) as well as the desktop entry. snapcraft
  # turns the metainfo's <launchable> into the menu entry (meta/gui) only when
  # parse-info belongs to the part that installs the .desktop, and only when it
  # sits under usr/share/applications. Without both, the snap installs fine but
  # the GUI never appears in the application menu.
  desktop-integration:
    plugin: dump
    source: packaging/linux
    parse-info:
      - usr/share/metainfo/io.github.lobotomoe.revenant.metainfo.xml
    organize:
      io.github.lobotomoe.revenant.desktop: usr/share/applications/io.github.lobotomoe.revenant.desktop
      io.github.lobotomoe.revenant.png: usr/share/icons/hicolor/256x256/apps/io.github.lobotomoe.revenant.png
      io.github.lobotomoe.revenant.metainfo.xml: usr/share/metainfo/io.github.lobotomoe.revenant.metainfo.xml
    stage:
      - usr/share/applications/io.github.lobotomoe.revenant.desktop
      - usr/share/icons/hicolor/256x256/apps/io.github.lobotomoe.revenant.png
      - usr/share/metainfo/io.github.lobotomoe.revenant.metainfo.xml
