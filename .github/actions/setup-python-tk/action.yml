name: Set up Python with Tk 9.0
description: >
  Install Homebrew Python + python-tk@3.13 (linked to Tk 9.0) and create a venv,
  for jobs that need a real native Tk on macOS -- the screenshot gallery and the
  py2app build test.

inputs:
  cache-key-prefix:
    description: Prefix for the pip cache key (must be unique per job)
    required: false
    default: pip-mac

runs:
  using: composite
  steps:
    # Tk comes from Homebrew as-is. This used to compile Tk from an unverified
    # upstream tarball to strip two private-API symbols that trip Mac App Store
    # guideline 2.5.1, which mattered only while the Python .app was submitted to
    # the store. The Rust GUI took over that submission, so the build-from-source
    # step and its unauthenticated download were removed with the Python desktop
    # release pipeline (GHSA-2qrm, GHSA-j66j).
    - name: Install Homebrew Python + Tk 9.0
      shell: bash
      run: |
        brew install python-tk@3.13
        PYTHON="$(brew --prefix python@3.13)/bin/python3.13"
        "$PYTHON" -m venv /tmp/venv-tk9
        echo "/tmp/venv-tk9/bin" >> "$GITHUB_PATH"

    - name: Cache pip downloads
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
      with:
        path: ~/Library/Caches/pip
        key: ${{ inputs.cache-key-prefix }}-${{ hashFiles('.github/requirements/build-macos.txt') }}
        restore-keys: ${{ inputs.cache-key-prefix }}-
