name: Sign in to Partner Center
description: >-
  Install the Microsoft Store CLI and sign it in to Partner Center as the
  revenant-ci Entra app, through the job's GitHub OIDC token. Needs a Windows
  runner, `id-token: write`, and the `microsoft-store` environment, which the
  app's federated credential trusts. Exports PRODUCT_ID and UPLOAD_URL_PARTS
  for the steps that follow.

runs:
  using: composite
  steps:
    # Windows only: the CLI's Linux build needs a running Secret Service just to
    # start, and does not keep its own settings between invocations
    # (microsoft/msstore-cli#181).
    - name: Check the runner
      shell: bash
      run: |
        if [ "$RUNNER_OS" != "Windows" ]; then
          echo "::error::the Microsoft Store CLI is only usable on a Windows runner"
          exit 1
        fi

    # A self-contained build; no .NET runtime needed. Pinned by version and
    # checksum.
    - name: Install msstore
      shell: bash
      env:
        MSSTORE_CLI_VERSION: v0.4.3
        MSSTORE_CLI_SHA256: c5fb008b616f96b1b55f1d52e4e0a5dd8f6c156129b5f52f9b97ec0eed11bd57
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/msstore.zip" \
          "https://github.com/microsoft/msstore-cli/releases/download/${MSSTORE_CLI_VERSION}/MSStoreCLI-win-x64.zip"
        echo "${MSSTORE_CLI_SHA256}  $RUNNER_TEMP/msstore.zip" | sha256sum --check
        7z x -y -bd -o"$RUNNER_TEMP/msstore" "$RUNNER_TEMP/msstore.zip" > /dev/null
        echo "$RUNNER_TEMP/msstore" >> "$GITHUB_PATH"

    # The token is short-lived, but one submission fits well inside it.
    - name: Sign in
      shell: bash
      env:
        TENANT_ID: b91cfdba-8ac2-4da3-a30c-6401e849e14d
        CLIENT_ID: aa0979c7-672b-4f5e-af69-34b7bdfae11f
        SELLER_ID: "93627990"
      run: |
        set -euo pipefail
        {
          # Store ID of "Revenant Sign" (apps.microsoft.com/detail/9NVH62M20DS3).
          echo "PRODUCT_ID=9NVH62M20DS3"
          echo "MSSTORE_TELEMETRY_OPTOUT=1"
          # The CLI prints a submission's package upload URL, a write-enabled
          # SAS link, wrapped over several console lines. Every line of it
          # carries one of these, so CLI output that can include a submission is
          # run through `grep -vE "$UPLOAD_URL_PARTS"` before it reaches the
          # public log.
          echo 'UPLOAD_URL_PARTS=FileUploadUrl|blob\.core\.windows\.net|&|%[0-9A-Fa-f]{2}'
          # Read by msstore whenever it needs a Partner Center token.
          echo "MSSTORE_CLIENT_ASSERTION_FILE=$RUNNER_TEMP/oidc-token"
        } >> "$GITHUB_ENV"
        export MSSTORE_TELEMETRY_OPTOUT=1
        export MSSTORE_CLIENT_ASSERTION_FILE="$RUNNER_TEMP/oidc-token"
        curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" |
          jq -er '.value' > "$MSSTORE_CLIENT_ASSERTION_FILE"
        msstore reconfigure --tenantId "$TENANT_ID" --sellerId "$SELLER_ID" \
          --clientId "$CLIENT_ID" --clientAssertion
