name: Publish to Microsoft Store

# Submits a released version to the Microsoft Store and commits it for
# certification: the release's MSIX, the screenshots it rendered for each
# listing language with their captions, and each language's What's New from the
# AppStream notes. The work is rust/packaging/windows/publish-microsoft-store.sh.
# Called by release.yml on a stable tag, and dispatchable for a chosen tag, with
# a dry run that does everything but commit.
#
# No stored credential: the script signs in to Partner Center as the
# `revenant-ci` Entra app with this job's GitHub OIDC token, which a federated
# credential on that app accepts for this repository's `microsoft-store`
# environment. The app holds the Manager (Windows) role in Partner Center.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v4.2.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v4.2.0)
        required: true
        type: string
      dry_run:
        description: Build and upload the submission, then delete it instead of committing
        type: boolean
        default: true

# Nothing at the top level: release.yml calls this with only what the job
# below asks for, and a called workflow may not request more than its caller
# grants.
permissions: {}

concurrency:
  group: msstore
  cancel-in-progress: false

jobs:
  publish:
    name: Submit to Microsoft Store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: microsoft-store
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # A prerelease tag is only good for a dry run: the Store has no
      # prerelease channel. Its notes are those of the version it rehearses.
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            exit 0
          fi
          if [ "$DRY_RUN" = true ] && printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            exit 0
          fi
          echo "::error::refusing to submit tag '$TAG'; expected vMAJOR.MINOR.PATCH, or a -rc.N tag for a dry run"
          exit 1

      # This workflow's own commit, not the tag's: the metainfo keeps every
      # release's notes, and a re-run for an older tag needs the current script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download the MSIX, screenshots and release checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "RevenantSign.msix" \
            --pattern "revenant-store-screenshots.zip" \
            --pattern "SHA256SUMS.txt" \
            --dir "$RUNNER_TEMP/release"

      - name: Verify the downloads against the release checksums
        working-directory: ${{ runner.temp }}/release
        run: |
          grep -E ' \./(RevenantSign\.msix|revenant-store-screenshots\.zip)$' SHA256SUMS.txt | sha256sum -c -
          unzip -q revenant-store-screenshots.zip -d screenshots

      - name: Submit
        env:
          TAG: ${{ inputs.tag }}
          # A dispatch defaults to a dry run; a release always commits.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          MSSTORE_CLIENT_ASSERTION="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -er '.value')"
          echo "::add-mask::$MSSTORE_CLIENT_ASSERTION"
          export MSSTORE_CLIENT_ASSERTION
          version="${TAG#v}"
          version="${version%%-*}"
          args=(publish "$RUNNER_TEMP/release/RevenantSign.msix" \
            "$RUNNER_TEMP/release/screenshots/microsoft-store" "$version")
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          rust/packaging/windows/publish-microsoft-store.sh "${args[@]}"
