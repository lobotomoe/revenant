name: Publish to Microsoft Store

# Submits a released version's MSIX to the Microsoft Store: uploads the package
# from the GitHub Release, replaces the listing's screenshots with the ones the
# release rendered, sets What's New to the release's AppStream notes, and
# commits the submission for certification. Called by release.yml on a stable
# tag, and dispatchable for a chosen tag so a failed or skipped submission can be
# redone without cutting a release.
#
# No stored credential: the job signs in to Partner Center as the `revenant-ci`
# Entra app with a GitHub OIDC token, accepted through a federated credential on
# that app for this repository's `microsoft-store` environment. The app holds the
# Manager (Windows) role in Partner Center, which the submission API requires.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v4.2.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v4.2.0)
        required: true
        type: string

# Nothing at the top level: release.yml calls this with only what the job
# below asks for, and a called workflow may not request more than its caller
# grants.
permissions: {}

concurrency:
  group: msstore-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Submit to Microsoft Store
    # Windows, where the Store CLI is supported in full: its Linux build needs a
    # running Secret Service just to start, and does not keep its own settings
    # between invocations (microsoft/msstore-cli#181).
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    environment: microsoft-store
    permissions:
      contents: read
      id-token: write
    env:
      MSSTORE_CLI_VERSION: v0.4.3
      MSSTORE_CLI_SHA256: c5fb008b616f96b1b55f1d52e4e0a5dd8f6c156129b5f52f9b97ec0eed11bd57
      # Store ID of "Revenant Sign" (apps.microsoft.com/detail/9NVH62M20DS3).
      PRODUCT_ID: 9NVH62M20DS3
      TENANT_ID: b91cfdba-8ac2-4da3-a30c-6401e849e14d
      CLIENT_ID: aa0979c7-672b-4f5e-af69-34b7bdfae11f
      SELLER_ID: "93627990"
      MSSTORE_TELEMETRY_OPTOUT: "1"
      # The CLI prints the submission's package upload URL, a write-enabled SAS
      # link, and wraps it over several console lines. Every line of it carries
      # one of these, so output from the steps that touch a submission is run
      # through `grep -vE "$UPLOAD_URL_PARTS"` before it reaches the public log.
      UPLOAD_URL_PARTS: "FileUploadUrl|blob\\.core\\.windows\\.net|&|%[0-9A-Fa-f]{2}"

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::refusing to submit tag '$TAG'; expected vMAJOR.MINOR.PATCH (the Store has no prerelease channel)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download the MSIX, screenshots and release checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/msix"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "RevenantSign.msix" \
            --pattern "revenant-store-screenshots.zip" \
            --pattern "SHA256SUMS.txt" \
            --dir "$RUNNER_TEMP/msix"

      - name: Verify the downloads against the release checksums
        working-directory: ${{ runner.temp }}/msix
        run: |
          grep -E ' \./(RevenantSign\.msix|revenant-store-screenshots\.zip)$' SHA256SUMS.txt | sha256sum -c -
          7z x -y -bd -o"$RUNNER_TEMP/screenshots" revenant-store-screenshots.zip > /dev/null

      # A self-contained build; no .NET runtime needed. Pinned by version and
      # checksum.
      - name: Install msstore
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/msstore.zip" \
            "https://github.com/microsoft/msstore-cli/releases/download/${MSSTORE_CLI_VERSION}/MSStoreCLI-win-x64.zip"
          echo "${MSSTORE_CLI_SHA256}  $RUNNER_TEMP/msstore.zip" | sha256sum --check
          7z x -y -bd -o"$RUNNER_TEMP/msstore" "$RUNNER_TEMP/msstore.zip" > /dev/null
          echo "$RUNNER_TEMP/msstore" >> "$GITHUB_PATH"

      # What's New for this version, from the same <release> entry the Snap and
      # the Linux software centres show.
      - name: Read the release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python - "${TAG#v}" > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          version = sys.argv[1]
          tree = ET.parse("rust/packaging/linux/io.github.lobotomoe.revenant.metainfo.xml")
          release = tree.find(f"./releases/release[@version='{version}']")
          if release is None:
              sys.exit(f"metainfo has no <release version='{version}'>")
          paragraphs = [" ".join("".join(p.itertext()).split()) for p in release.iter("p")]
          if not paragraphs:
              sys.exit(f"<release version='{version}'> has no description")
          # Plain newlines, not the CRLF Windows text mode would write.
          sys.stdout.reconfigure(newline="\n")
          print("\n\n".join(paragraphs))
          EOF
          cat "$RUNNER_TEMP/release-notes.txt"

      # The token is short-lived, but one submission fits well inside it.
      - name: Sign in to Partner Center
        run: |
          set -euo pipefail
          # Read by msstore whenever it needs a Partner Center token.
          MSSTORE_CLIENT_ASSERTION_FILE="$RUNNER_TEMP/oidc-token"
          echo "MSSTORE_CLIENT_ASSERTION_FILE=$MSSTORE_CLIENT_ASSERTION_FILE" >> "$GITHUB_ENV"
          export MSSTORE_CLIENT_ASSERTION_FILE
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" |
            jq -er '.value' > "$MSSTORE_CLIENT_ASSERTION_FILE"
          msstore reconfigure --tenantId "$TENANT_ID" --sellerId "$SELLER_ID" \
            --clientId "$CLIENT_ID" --clientAssertion

      # `publish` replaces any pending draft with a new one carrying the package,
      # so the notes are set after it, and the draft is committed only once both
      # are in.
      - name: Upload the package
        run: |
          # The package itself as the path: the CLI recognises a ready MSIX by
          # its extension, and treats a directory as a project to build.
          msstore publish "$RUNNER_TEMP/msix/RevenantSign.msix" --appId "$PRODUCT_ID" \
            --noCommit --uploadTimeout 600 2>&1 | { grep -vE "$UPLOAD_URL_PARTS" || true; }

      # The draft `publish` left holds the package in the upload zip. That zip
      # is replaced by one holding the package and the new screenshots, and the
      # draft is edited to match: every listing's screenshots swapped for the
      # new ones (at the zip's root, named after the version so they never
      # collide with the ones being removed), and every listing's What's New set
      # to this release's notes. The JSON keys are the CLI's: it reads the
      # submission into its own models and writes them back.
      - name: Update the listing
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A POSIX path, so globs and redirections behave the same in Git Bash.
          temp="$(cygpath -u "$RUNNER_TEMP")"
          msstore submission get "$PRODUCT_ID" > "$temp/submission.json"

          upload_url="$(jq -er '.FileUploadUrl' "$temp/submission.json")"
          echo "::add-mask::$upload_url"
          if ! jq -e '.ApplicationPackages[] | select(.FileName == "RevenantSign.msix" and .FileStatus == "PendingUpload")' \
            "$temp/submission.json" > /dev/null; then
            echo "::error::the draft does not hold RevenantSign.msix as its new package"
            exit 1
          fi

          bundle="$temp/bundle"
          mkdir -p "$bundle"
          cp "$temp/msix/RevenantSign.msix" "$bundle/"
          shots=()
          for shot in "$temp"/screenshots/microsoft-store/*.png; do
            name="screenshot-${TAG#v}-$(basename "$shot")"
            cp "$shot" "$bundle/$name"
            shots+=("$name")
          done
          # The Store takes at most ten screenshots per listing.
          if [ "${#shots[@]}" -eq 0 ] || [ "${#shots[@]}" -gt 10 ]; then
            echo "::error::expected 1 to 10 Microsoft Store screenshots, found ${#shots[@]}"
            exit 1
          fi
          (cd "$bundle" && 7z a -tzip -bd "$temp/upload.zip" RevenantSign.msix "${shots[@]}" > /dev/null)
          curl -fsS --retry 3 -X PUT -H "x-ms-blob-type: BlockBlob" \
            -T "$temp/upload.zip" "$upload_url" > /dev/null

          jq -c \
            --rawfile notes "$temp/release-notes.txt" \
            --args '
              ($ARGS.positional | map({FileName: ., FileStatus: "PendingUpload", ImageType: "Screenshot"})) as $new
              | .Listings |= with_entries(
                  .value.BaseListing.ReleaseNotes = ($notes | rtrimstr("\n"))
                  | .value.BaseListing.Images = (
                      [(.value.BaseListing.Images // [])[]
                        | if .ImageType == "Screenshot" then .FileStatus = "PendingDelete" else . end]
                      + $new))
            ' "${shots[@]}" < "$temp/submission.json" > "$temp/submission-updated.json"
          msstore submission update "$PRODUCT_ID" "$(cat "$temp/submission-updated.json")" \
            2>&1 | { grep -vE "$UPLOAD_URL_PARTS" || true; }

      - name: Submit for certification
        run: |
          msstore submission publish "$PRODUCT_ID" 2>&1 | { grep -vE "$UPLOAD_URL_PARTS" || true; }
