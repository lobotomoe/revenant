name: Microsoft Store status

# Prints where the app's latest Microsoft Store submission stands (in
# certification, published, failed with what), so it can be read without
# Partner Center. Read-only: it changes nothing in the Store.

on:
  workflow_dispatch:

permissions: {}

jobs:
  status:
    name: Submission status
    # The Store CLI is usable only on Windows; see the msstore-signin action.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    environment: microsoft-store
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Sign in to Partner Center
        uses: ./.github/actions/msstore-signin

      - name: Show the submission status
        run: |
          msstore submission status "$PRODUCT_ID" 2>&1 | { grep -vE "$UPLOAD_URL_PARTS" || true; }
